name: PyProject
on:
  push:
    branches:
    - workflow_call
    paths:
      - pyproject.toml
jobs:
  check:
    name: Check for a new release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Parse version
        id: version
        run: sed -ne 's/^version = "\([^"]\+\)"$/version=\1/p' pyproject.toml | head -1 | tee -a "$GITHUB_OUTPUT"
      - name: Check for tag
        id: tag
        uses: actions/github-script@v6
        with:
          retries: 5
          result-encoding: string
          script: |
            try {
              const ref = await github.rest.git.getRef({
                ...context.repo,
                ref: "tags/${{ steps.version.outputs.version }}",
              });
            } catch (error) {
              if (error.status === 404) {
                return "";
              }
            }
            return "${{ steps.version.outputs.version }}";
  tag:
    name: Create a new release tag
    runs-on: 'ubuntu-latest'
    needs: check
    if: ${{ success() && needs.check.outputs.tag == '' }}
    steps:
      - name: Create release tag
        uses: actions/github-script@v6
        with:
          retries: 5
          script: |
            const annotatedTag = await github.rest.git.createTag({
              ...context.repo,
              tag: "${{ needs.check.outputs.version }}",
              message: "${{ github.event.head_commit.message }}",
              object: context.sha,
              type: "commit",
            });
            return await github.rest.git.createRef({
              ...context.repo,
              ref: "refs/tags/${{ needs.check.outputs.version }}",
              sha: annotatedTag.data.sha,
            });
  create:
    name: Create release
    needs: [check, tag]
    uses: ./.github/workflows/create_release.yml
    with:
      tag_name: ${{ needs.check.outputs.version }}
