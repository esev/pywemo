name: Publish
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  check:
    name: Check version and tag match
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
      - name: Check if tag version matches project version
        run: |
          BUILD_VERSION="${{ needs.build.outputs.version }}"
          echo "TAG: $GITHUB_REF_NAME"
          echo "VERSION: $BUILD_VERSION"
          if [[ "$GITHUB_REF_NAME" != "$BUILD_VERSION" ]]; then exit 1; fi
      - name: Verify checksums match
        run: echo "${{ needs.build.outputs.hashes }}" | base64 -d | sha256sum -c || exit 1

  provenance:
    name: Publish SLSA provenance
    needs: [build, check]
    permissions:
      # Needed to detect the GitHub Actions environment
      actions: read
      # Needed to create the provenance via GitHub OIDC
      id-token: write
      # Needed to create and upload to GitHub Releases
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.5.0
    with:
      # SHA-256 hashes of the Python distributions.
      base64-subjects: ${{ needs.build.outputs.hashes }}
      # Provenance file name.
      provenance-name: pywemo-${{ needs.build.outputs.version }}.intoto.json
      # Uploads the provenance file to the GitHub Release.
      upload-assets: true

  assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build, provenance]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - name: Output hashes
        run: echo "${{ needs.build.outputs.hashes }}" | base64 -d > dist/sha256sum.txt
      - name: Upload release assets
        run: gh release upload ${{ github.ref_name }} dist/* --repo ${{ github.repository }}

  pypi:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    needs: [provenance]
    environment: release
    permissions:
      id-token: write # For PyPI trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.8.6
        with:
          repository-url: https://test.pypi.org/legacy/
