name: Publish
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  check:
    name: Check version and tag match
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
      - name: Check if tag version matches project version
        run: |
          BUILD_VERSION="${{ needs.build.outputs.version }}"
          echo "TAG: $GITHUB_REF_NAME"
          echo "VERSION: $BUILD_VERSION"
          if [[ "$GITHUB_REF_NAME" != "$BUILD_VERSION" ]]; then exit 1; fi

  hash:
    name: Generate SHA256 hashes
    needs: [build, check]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - name: Hash dist files
        id: hash
        working-directory: dist
        run: |
          sha256sum * | tee "pywemo-${{ needs.build.outputs.version }}.sha256sum.txt"
          echo "hashes=$(sha256sum * | base64 -w0)" | tee -a "$GITHUB_OUTPUT"
      - name: Archive hashes
        uses: actions/upload-artifact@v3
        with:
          if-no-files-found: error
          name: hashes
          path: dist/pywemo-${{ needs.build.outputs.version }}.sha256sum.txt

  slsa:
    name: Generate SLSA provenance
    needs: [build, hash]
    permissions:
      # Needed to upload assets to the Github release.
      # TODO: Find a way to remove this:
      #   https://github.com/slsa-framework/slsa-github-generator/issues/2044
      contents: write  
      # Needed to detect the GitHub Actions environment.
      actions: read
      # Needed to create the provenance via GitHub OIDC.
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.5.0
    with:
      # SHA-256 hashes of the Python distributions.
      base64-subjects: ${{ needs.hash.outputs.hashes }}
      # Provenance file name.
      provenance-name: provenance-pywemo-${{ needs.build.outputs.version }}.intoto.jsonl

  sigstore:
    name: Generate Sigstore signatures
    needs: [build, hash]
    runs-on: ubuntu-latest
    permissions:
      # For Sigstore provenance.
      id-token: write 
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
      - name: Sign the release
        uses: sigstore/gh-action-sigstore-python@v1.2.3
        with:
          inputs: ./dist/* ./hashes/*
          upload-signing-artifacts: true

  assets:
    name: Publish Release assets
    needs: [build, hash, slsa, sigstore]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Needed to run "gh release upload".
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download build artifacts
        uses: actions/download-artifact@v3
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} --repo ${{ github.repository }} \
            ./dist/* \
            ./hashes/* \
            ./${{ needs.slsa.outputs.provenance-name }}/*.intoto.jsonl \
            ./signing-artifacts-sigstore/*/*.sigstore
      - name: Add SHA256SUM environment variable
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "SHA256SUM<<$EOF" >> "$GITHUB_ENV"
          cat ./hashes/*.sha256sum.txt >> "$GITHUB_ENV"
          echo "$EOF" >> "$GITHUB_ENV"
      - name: Update release text
        env:
          BODY: ${{ github.event.release.body || '' }}
          RELEASE_ID: ${{ github.event.release.id }}
          TEMPLATE_FILE: ./.github/RELEASE_NOTES_TEMPLATE.md
        uses: actions/github-script@v6
        with:
          script: |
            const fsp = require('fs').promises;
            let body = await fsp.readFile(process.env.TEMPLATE_FILE, { encoding: 'utf8' });
            for (const [key, value] of Object.entries(process.env)) {
                body = body.replaceAll(`\${${key}}`, value);
            }

            await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: process.env.RELEASE_ID,
                body: body,
            });

  pypi:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    needs: [assets]
    environment: release
    permissions:
      # Needed for PyPI trusted publishing.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.8.6
        with:
          repository-url: https://test.pypi.org/legacy/
