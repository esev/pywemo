name: Create Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'

jobs:
  build:
    uses: ./.github/workflows/build.yml
  create_release:
    name: Create a draft release
    runs-on: 'ubuntu-latest'
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-files-3.10
          path: dist
      - name: List dist files
        run: ls -R
        working-directory: dist
      - name: Add environment vars
        run: |
          echo "PROJECT_VERSION=$(ls -1 dist/pywemo-*.tar.gz | sed -e 's/.*pywemo-\(.*\)\.tar\.gz/\1/')" | tee -a $GITHUB_ENV
          echo "TAG_MESSAGE=$(git tag -l $GITHUB_REF_NAME --format '%(contents:lines=1)')" | tee -a $GITHUB_ENV
      - name: Check if tag version matches project version
        run: |
          echo $GITHUB_REF_NAME
          echo $PROJECT_VERSION
          if [[ "$GITHUB_REF_NAME" != "$PROJECT_VERSION" ]]; then exit 1; fi
      - name: Generate Checksums
        run: sha256sum pywemo-${PROJECT_VERSION}{-py3-none-any.whl,.tar.gz} > sha256sums.txt
        working-directory: dist
      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }} - ${{ env.TAG_MESSAGE }}
          body_path: ".github/RELEASE-TEMPLATE.md"
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
          files: |
            dist/pywemo-${{env.PROJECT_VERSION}}-py3-none-any.whl
            dist/pywemo-${{env.PROJECT_VERSION}}.tar.gz
            dist/sha256sums.txt
