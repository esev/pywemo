name: Build
on:
  pull_request:
  push:
    branches:
    - main
    - pywemo_esev
  workflow_call:

permissions: {}  # No permissions needed for this workflow.

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      coverage-lcov: ${{ steps.build.outputs.coverage-lcov }}
      hashes: ${{ steps.build.outputs.hashes }}
      version: ${{ steps.build.outputs.version }}
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.7', '3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build
        id: build
        run: ./scripts/build.sh
        env:
          ENV_OUTPUT_VAR: ${{ (matrix.python-version == '3.10' && 'GITHUB_OUTPUT') || '' }}
      - name: Archive build files (Python 3.10 only)
        if: ${{ success() && steps.build.outputs.build-artifacts != '' }}
        uses: actions/upload-artifact@v3
        with:
          if-no-files-found: error
          name: build-artifacts
          path: ${{ steps.build.outputs.build-artifacts }}

  coverage:
    name: Report coverage to coveralls.io
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
      - name: Report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: ${{ needs.build.outputs.coverage-lcov }}
